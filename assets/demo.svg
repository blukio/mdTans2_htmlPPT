<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="Markdown 到幻灯片的构建流程">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="720" height="240" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="718" height="238" rx="16" fill="none" stroke="#e5e7eb" stroke-width="2"/>

  <text x="60" y="112" font-family="system-ui, PingFang SC, sans-serif" font-size="22" fill="#111">Markdown</text>
  <text x="60" y="146" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#555">slides.md</text>

  <path d="M200 120 H 292" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>
  <polygon points="292,108 312,120 292,132" fill="#8b5cf6"/>

  <text x="330" y="112" font-family="system-ui, PingFang SC, sans-serif" font-size="22" fill="#111">build.py</text>
  <text x="330" y="146" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#555">Markdown + Jinja2</text>

  <path d="M470 120 H 562" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>
  <polygon points="562,108 582,120 562,132" fill="#06b6d4"/>

  <text x="600" y="112" font-family="system-ui, PingFang SC, sans-serif" font-size="22" fill="#111">slides.html</text>
  <text x="600" y="146" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#555">单文件</text>
